[tool.poetry]
package-mode = false

[project]
name = "pinn-labs"
version = "0.1.0"
description = "Physics Informed Neural Networks Labs"
authors = [
    {name = "Student"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch (>=2.9.1,<3.0.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "imageio (>=2.37.2,<3.0.0)",
    "jupyterlab (>=4.5.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
