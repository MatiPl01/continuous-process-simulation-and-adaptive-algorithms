[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[project]
name = "pinn-labs"
version = "0.1.0"
description = "Physics Informed Neural Networks Labs"
authors = [
    {name = "Student"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch (==2.6.0+cu124)",
    "numpy (>=2.4.1,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "imageio (>=2.37.2,<3.0.0)",
    "jupyterlab (>=4.5.1,<5.0.0)",
    "scipy (>=1.17.0,<2.0.0)"
]

[tool.poetry.dependencies]
torch = { version = "==2.6.0+cu124", source = "pytorch" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "notebook (>=7.5.2,<8.0.0)"
]
